version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: grepmind_postgres
    environment:
      POSTGRES_DB: grepmind
      POSTGRES_USER: grepmind_user
      POSTGRES_PASSWORD: grepmind_pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grepmind_user -d grepmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grepmind_backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://grepmind_user:grepmind_pass@postgres:5432/grepmind
      - JWT_SECRET=production-jwt-secret-key-must-be-changed-2024-very-long-secure-key
      - CORS_ORIGIN=http://dashboard.grepmind.com
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const options = { hostname: 'localhost', port: 3001, path: '/health', timeout: 2000 }; const req = http.request(options, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.end();"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grepmind_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://dashboard.grepmind.com/api
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: grepmind_network