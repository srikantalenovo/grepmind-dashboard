# Default values for grepmind-dashboard-frontend
replicaCount: 1 

image:
  repository: srikanta1219/grepmind-dashboard-frontend
  tag: "latest"
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

# Service Configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Environment Variables
env:
  NODE_ENV: "production"
  VITE_API_URL: "http://dashboard.grepmind.com/api"
  VITE_WS_URL: "ws://dashboard.grepmind.com"
  VITE_APP_NAME: "GrepMind Dashboard"
  VITE_APP_VERSION: "1.0.0"
  VITE_ENABLE_DEV_TOOLS: "false"
  VITE_NODE_ENV: "production"
  PORT: "3000"

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/connection: "upgrade"
    nginx.ingress.kubernetes.io/upgrade: "websocket"
    # Backend protocol
    nginx.ingress.kubernetes.io/backend-protocol: 'HTTP'
    # Session affinity for WebSocket
    nginx.ingress.kubernetes.io/affinity: 'cookie'
    nginx.ingress.kubernetes.io/affinity-mode: 'persistent'
    nginx.ingress.kubernetes.io/session-cookie-name: 'ws-server'
    nginx.ingress.kubernetes.io/session-cookie-expires: '86400'
    nginx.ingress.kubernetes.io/session-cookie-max-age: '86400'
    nginx.ingress.kubernetes.io/session-cookie-path: '/'

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: '10'
    nginx.ingress.kubernetes.io/limit-connections: '100'      

    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/cors-max-age: '1728000'      

  hosts:
    - host: dashboard.grepmind.com
      paths:
        # Frontend
        - path: /
          pathType: Prefix
          backend:
            service:
              name: grepmind-dashboard-frontend
              port:
                number: 80

        # Backend API
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: grepmind-dashboard-backend
              port:
                number: 3001

        # WebSocket endpoint
        - path: /ws
          pathType: Prefix
          backend:
            service:
              name: grepmind-dashboard-backend
              port:
                number: 3001

        # WebSocket monitoring endpoint
        - path: /ws/monitoring
          pathType: Prefix
          backend:
            service:
              name: grepmind-dashboard-backend
              port:
                number: 3001                
  tls: []
  #  - secretName: dashboard-grepmind-tls
  #    hosts:
  #      - dashboard.grepmind.com

# Resource Limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Health Checks
livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Security Context
securityContext:
  runAsNonRoot: true
  runAsUser: 101
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Pod Security Context
podSecurityContext:
  fsGroup: 101

# Service Account
serviceAccount:
  create: false
  annotations: {}
  name: ""

# Node Selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod Annotations
podAnnotations: {}

# Pod Labels
podLabels: {}

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

