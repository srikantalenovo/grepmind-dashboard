# Default values for grepmind-dashboard-frontend
replicaCount: 2

image:
  repository: srikanta1219/grepmind-dashboard-frontend
  tag: "latest"
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

# Service Configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 80

# Environment Variables
env:
  NODE_ENV: "production"
  VITE_API_URL: "http://dashboard.grepmind.com"
  VITE_APP_NAME: "GrepMind Dashboard"
  VITE_APP_VERSION: "1.0.0"
  VITE_ENABLE_DEV_TOOLS: "false"
  VITE_NODE_ENV: "production"
  PORT: "80"

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
  hosts:
    - host: dashboard.grepmind.com
      paths:
        - path: /
          pathType: Prefix
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: grepmind-dashboard-backend
              port:
                number: 3001
        - path: /ws
          pathType: Prefix
          backend:
            service:
              name: grepmind-dashboard-backend
              port:
                number: 3001
  tls: []
  #  - secretName: dashboard-grepmind-tls
  #    hosts:
  #      - dashboard.grepmind.com

# Resource Limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Health Checks
livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Security Context
securityContext:
  runAsNonRoot: true
  runAsUser: 101
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Pod Security Context
podSecurityContext:
  fsGroup: 101

# Service Account
serviceAccount:
  create: false
  annotations: {}
  name: ""

# Node Selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod Annotations
podAnnotations: {}

# Pod Labels
podLabels: {}

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
