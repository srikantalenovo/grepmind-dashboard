# Production values for GrepMind Dashboard
# Override default values for production deployment

# Global settings
global:
  imageRegistry: "srikanta1219"
  imagePullPolicy: Always
  storageClass: "nfs-storage"
  domain: "dashboard.grepmind.com"

# PostgreSQL Configuration
postgresql:
  enabled: true
  replicaCount: 1
  image:
    tag: "15-alpine"
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi
  persistence:
    enabled: true
    storageClass: "nfs-storage"
    size: 20Gi
    nfs:
      server: "10.0.0.20"
      path: "/srv/nfs/kubedata/postgres"
  postgresql:
    auth:
      postgresPassword: "prod-postgres-password-change-me"
      username: "grepmind_prod"
      password: "prod-user-password-change-me"
      database: "grepmind_dashboard_prod"

# Backend Configuration
backend:
  enabled: true
  replicaCount: 3
  image:
    repository: srikanta1219/grepmind-dashboard-backend
    tag: "latest"
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi
  env:
    NODE_ENV: "production"
    DATABASE_URL: "postgresql://grepmind_prod:prod-user-password-change-me@grepmind-dashboard-postgresql:5432/grepmind_dashboard_prod"
    JWT_SECRET: "production-jwt-secret-key-must-be-changed-2024"
    JWT_REFRESH_SECRET: "production-refresh-secret-key-must-be-changed-2024"
    CORS_ORIGIN: "http://dashboard.grepmind.com"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# Frontend Configuration
frontend:
  enabled: true
  replicaCount: 3
  image:
    repository: srikanta1219/grepmind-dashboard-frontend
    tag: "latest"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  env:
    NODE_ENV: "production"
    VITE_API_URL: "http://dashboard.grepmind.com"
    VITE_APP_NAME: "GrepMind Dashboard"
    VITE_APP_VERSION: "1.0.0"
    VITE_ENABLE_DEV_TOOLS: "false"
    VITE_NODE_ENV: "production"
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-origin: "*"
      # Rate limiting
      nginx.ingress.kubernetes.io/rate-limit-rpm: "300"
      nginx.ingress.kubernetes.io/rate-limit-connections: "20"
    hosts:
      - host: dashboard.grepmind.com
        paths:
          - path: /
            pathType: Prefix
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: grepmind-dashboard-backend
                port:
                  number: 3001
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: grepmind-dashboard-backend
                port:
                  number: 3001
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
